name: allure-pages

# Публикует Allure-отчёт регресса с main на GitHub Pages. Тесты заново не
# запускаются: берётся артефакт allure-report-regress из завершённого прогона
# workflow tests. В PR этот workflow не появляется.
on:
  workflow_run:
    workflows: [ tests ]
    types: [ completed ]
    branches: [ main ]

permissions:
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Allure-отчёт на GitHub Pages
    # Отчёт публикуется и при упавшем регрессе: тогда он нужнее всего.
    # Прогоны PR отсекаются явно, на случай PR из ветки с именем main в форке.
    if: github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download Allure report from the tests run
        uses: actions/download-artifact@v4
        with:
          name: allure-report-regress
          path: allure-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Upload report for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
