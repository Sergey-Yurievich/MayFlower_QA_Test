name: tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  contract-tests:
    name: Contract tests (WireMock, без внешних зависимостей)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run contract tests
        run: ./gradlew contractTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: build/reports/tests/

      # Отчёт одним HTML-файлом: открывается из скачанного артефакта без веб-сервера.
      - name: Build Allure report
        if: always()
        run: ./gradlew allureReport --single-file=true

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-contract
          path: build/reports/allure-report/allureReport/

  api-tests:
    name: Regress (живой sandbox, информационно)
    runs-on: ubuntu-latest
    # Sandbox внешний и может быть недоступен — падение не должно блокировать PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Регресс включает и смоук: P0-тесты помечены обоими тегами.
      # Тесты на известные дефекты пропускаются (@Disabled с ID бага).
      - name: Run regress
        run: ./gradlew regressTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-junit-report
          path: build/reports/tests/

      - name: Build Allure report
        if: always()
        run: ./gradlew allureReport --single-file=true

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-regress
          path: build/reports/allure-report/allureReport/

      # На Pages публикуется только отчёт с main: прогоны PR не перезаписывают сайт.
      - name: Upload Allure report for GitHub Pages
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/reports/allure-report/allureReport/

  allure-pages:
    name: Allure-отчёт на GitHub Pages
    needs: api-tests
    # always(): регресс информационный и может упасть, отчёт нужен и в этом случае.
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
